plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

sourceSets {
    // 開発専用の GameTest 足場。jar タスクの入力は main だけなので、この source set は
    // 出荷 jar に入らない (テストのクラスも構造テンプレートも利用者の環境には無関係)。
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output
    }
    // Dev-only client probe (creates a world and exercises the feature next to a real player).
    clientprobe {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    addModdingDependenciesTo sourceSets.gametest
    addModdingDependenciesTo sourceSets.clientprobe
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        // GameTest を持つだけの開発専用 mod。gameTestServer の run にしか読み込ませない。
        "${mod_id}_gametest" {
            sourceSet sourceSets.gametest
        }
        "${mod_id}_clientprobe" {
            sourceSet sourceSets.clientprobe
        }
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
            // 既定は「登録済みの mod 全部」。テスト mod が client/server/data にも載ってしまうので明示する。
            loadedMods = [project.neoForge.mods.getByName(mod_id)]
        }
        client {
            client()
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
        // Headless behaviour tests: ./gradlew :neoforge:runGameTestServer
        // The namespace is already set for every run above by configureEach.
        // Automated client check: ./gradlew :neoforge:runProbeClient (through _tools/runclient_fresh.sh)
        probeClient {
            client()
            sourceSet = sourceSets.clientprobe
            loadedMods = [
                    project.neoForge.mods.getByName(mod_id),
                    project.neoForge.mods.getByName("${mod_id}_clientprobe")
            ]
        }
        gameTestServer {
            type = 'gameTestServer'
            // テスト本体・テスト mod・テスト用 structure はこの source set にしかない。
            sourceSet = sourceSets.gametest
            loadedMods = [
                    project.neoForge.mods.getByName(mod_id),
                    project.neoForge.mods.getByName("${mod_id}_gametest")
            ]
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Dev-only extra mods (JEI etc.). runclient-hosts.gradle is local and never committed.
configurations { localRuntime }
configurations.runtimeClasspath.extendsFrom(configurations.localRuntime)
configurations.gametestRuntimeClasspath.extendsFrom(configurations.localRuntime)
configurations.clientprobeRuntimeClasspath.extendsFrom(configurations.localRuntime)
if (rootProject.file('runclient-hosts.gradle').exists()) {
    apply from: rootProject.file('runclient-hosts.gradle')
}
// Same-feature mod probe: ./gradlew :neoforge:runGameTestServer -PcoexistJar=/abs/path/other.jar
// The GameTests then expect this mod to stand down instead of doubling the effect.
// Add -PcoexistControl to keep the normal expectations (negative control: those tests must fail).
if (project.hasProperty('coexistJar')) {
    dependencies { localRuntime files(project.property('coexistJar')) }
    if (!project.hasProperty('coexistControl')) {
        neoForge.runs.configureEach { systemProperty('xp_orb_merge.expectInactive', 'true') }
    }
}
